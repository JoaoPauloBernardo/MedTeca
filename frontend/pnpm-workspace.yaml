# Configuração do pnpm do frontend: a política de dependências da seção 6.E
# de docs/seguranca-e-privacidade.md.

# Espera de 7 dias (10.080 minutos) para versões novas (P6-08, RNF-73).
minimumReleaseAge: 10080

# Scripts de instalação das dependências não rodam. Cada liberação é
# aprovada pelo usuário e registrada aqui, com o motivo (P6-09).
strictDepBuilds: true
allowBuilds: {}

# A instalação falha se um pacote perde o nível de confiança com que era
# publicado, sinal comum de conta invadida (P6-09).
trustPolicy: no-downgrade

# Nenhuma dependência vem direto de Git ou de arquivo baixado (P6-07).
blockExoticSubdeps: true

# O eslint-plugin-jsx-a11y declara suporte ao ESLint só até o 9, que deixou
# de ter suporte. Testado com o ESLint 10 em 2026-11-26: as regras de
# acessibilidade acusam o que devem. A liberação vale só para esse par.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: "10"

# Licenças aceitas com motivo (seção 6.E.7):
# - axe-core e @axe-core/playwright (MPL-2.0): só nos testes de
#   acessibilidade (D-026); nunca entram no app entregue ao estudante.
