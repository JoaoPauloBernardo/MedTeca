# Configuração do pnpm do frontend: a política de dependências da seção 6.E
# de docs/seguranca-e-privacidade.md.

# Espera de 7 dias (10.080 minutos) para versões novas (P6-08, RNF-73).
minimumReleaseAge: 10080

# Scripts de instalação das dependências não rodam. Cada liberação é
# aprovada pelo usuário e registrada aqui, com o motivo (P6-09).
strictDepBuilds: true
allowBuilds: {}

# A instalação falha se um pacote perde o nível de confiança com que era
# publicado, sinal comum de conta invadida (P6-09).
trustPolicy: no-downgrade

# Nenhuma dependência indireta vem direto de Git ou de arquivo baixado
# (P6-07). As diretas, que esta opção não cobre, são conferidas pelo teste
# do FUND-04 e pela revisão do package.json.
blockExoticSubdeps: true

# Se o packageManager do package.json pedir outra versão do pnpm, a
# instalação falha em vez de baixá-la: a versão do pnpm vem da imagem, com
# o hash conferido.
pmOnFail: error

# O eslint-plugin-jsx-a11y declara suporte ao ESLint só até o 9, que deixou
# de ter suporte. Testado com o ESLint 10 em 2026-11-26: as regras de
# acessibilidade acusam o que devem. A liberação vale só para esse par.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: "10"

# Licenças aceitas com motivo (seção 6.E.7). O que vai para o app do
# estudante (react, react-dom, scheduler, openapi-fetch e os tipos dele) é
# todo MIT; as exceções abaixo são só de ferramentas:
# - axe-core e @axe-core/playwright (MPL-2.0): só nos testes de
#   acessibilidade (D-026).
# - lightningcss (MPL-2.0), dependência do Vite 8: processa o CSS no build;
#   o código dele não vai para o app, só o CSS que ele gera.
# Licenças fora da lista, aprovadas pelo usuário só para ferramentas de
# desenvolvimento ("Aceito nas ferramentas", 2026-11-27):
# - BlueOak-1.0.0: lru-cache, minimatch e @isaacs/nonrecursive-glob-match
#   (do ESLint e do jsdom); permissiva, aprovada pela OSI.
# - CC-BY-4.0: caniuse-lite, dados de compatibilidade de navegadores.
# - Python-2.0: argparse (do openapi-typescript); mesma família da PSF-2.0.
