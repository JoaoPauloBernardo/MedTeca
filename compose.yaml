# Ambiente de desenvolvimento do MedTeca (design da fundação).
#
#   docker compose up                      sobe tudo; a página fica em http://localhost:5173
#   docker compose run --rm dev <comando>  roda um comando dentro do ambiente
#
# Só a pasta do repositório entra nos contêineres; nenhuma pasta nem
# credencial do computador do usuário (FUND-03, RNF-85). Só o serviço web
# publica porta, e só para o próprio computador (FUND-02). Os dados são
# fictícios.
#
# O repositório entra só para leitura, e só backend/, frontend/ e scripts/
# aceitam escrita. Assim, código de terceiros rodando no contêiner não
# consegue gravar no .git (hooks, core.fsmonitor), no .claude, no
# compose.yaml, no .devcontainer nem em arquivos novos na raiz, que o
# Windows executaria ou leria sozinho antes de qualquer revisão.

name: medteca

x-ambiente: &ambiente
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
  image: medteca-dev:local
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  working_dir: /workspace
  environment:
    DJANGO_SETTINGS_MODULE: medteca.settings.dev
    PGHOST: db
    PGPORT: "5432"
    PGDATABASE: medteca
    PGUSER: medteca
    PGPASSWORD: senha-ficticia-so-para-desenvolvimento
  volumes:
    - .:/workspace:ro
    - ./backend:/workspace/backend
    - ./frontend:/workspace/frontend
    - ./scripts:/workspace/scripts
    - venv:/workspace/backend/.venv
    - node_modules:/workspace/frontend/node_modules
    - cache-uv:/home/dev/.cache/uv
    - store-pnpm:/home/dev/.local/share/pnpm
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    # PostgreSQL 18.6, Debian 13 (trixie); publicado em 2026-11-06.
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_DB: medteca
      POSTGRES_USER: medteca
      POSTGRES_PASSWORD: senha-ficticia-so-para-desenvolvimento
    volumes:
      - dados-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "medteca", "-d", "medteca"]
      interval: 2s
      timeout: 3s
      retries: 30

  dev:
    <<: *ambiente
    command: ["sleep", "infinity"]

  api:
    <<: *ambiente
    # Instala pelo lockfile e sobe o servidor de desenvolvimento do Django,
    # que recarrega a cada mudança no código. Sem porta publicada: o
    # navegador chega à API pelo repasse do Vite (D-020).
    command:
      - sh
      - -c
      - cd backend && uv sync --locked && exec uv run python manage.py runserver 0.0.0.0:8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/saude", timeout=2)
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 120s

  web:
    <<: *ambiente
    # Instala pelo lockfile e sobe o servidor do Vite, que repassa /api para
    # a API. É a única porta publicada, e só para o próprio computador
    # (127.0.0.1): a página fica em http://localhost:5173 (FUND-01, FUND-02).
    command:
      - sh
      - -c
      - cd frontend && pnpm install --frozen-lockfile && exec pnpm exec vite
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:5173/", timeout=2)
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 120s

  e2e:
    # Testes de ponta a ponta (FUND-16, D-026) com a imagem oficial do
    # Playwright, que traz os navegadores. Só sobe com o perfil e2e:
    #   docker compose --profile e2e run --rm e2e
    # Playwright 1.65.1, Ubuntu 24.04 (noble); publicada em 2026-11-13. A versão
    # é a mesma do @playwright/test do frontend.
    image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    profiles: [e2e]
    init: true
    user: pwuser
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # O Chromium usa a memória compartilhada; o padrão de 64 MB é pouco.
    shm_size: 1gb
    working_dir: /workspace/frontend
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - .:/workspace:ro
      - ./frontend:/workspace/frontend
      - node_modules:/workspace/frontend/node_modules:ro
    command: ["npx", "--no-install", "playwright", "test"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  dados-db:
  venv:
  node_modules:
  cache-uv:
  store-pnpm:
